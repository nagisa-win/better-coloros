name: Build & Release Android APK

on:
  push:
    branches:
      - main
      - master
    tags:
      - 'v*'
  pull_request:
  workflow_dispatch:
    inputs:
      create_release:
        description: 'Create a GitHub Release with built APKs'
        required: false
        type: boolean
        default: true

permissions:
  contents: write

jobs:
  build:
    name: Build APK & Release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Run Unit Tests
        run: ./gradlew test --stacktrace --info

      - name: Upload Test Report on Failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: app/build/reports/tests/

      - name: Build with Gradle
        run: ./gradlew assembleRelease assembleDebug --stacktrace

      - name: Prepare APKs
        run: |
          mkdir -p dist
          VERSION_CODE=$(grep 'versionCode =' app/build.gradle.kts | head -n1 | sed -E 's/[^0-9]*([0-9]+).*/\1/')
          echo "Detected versionCode: $VERSION_CODE"

          RELEASE_APK=$(find app/build/outputs/apk/release/ -name "*.apk" | head -n1)
          if [ -n "$RELEASE_APK" ]; then
            cp "$RELEASE_APK" "dist/better-coloros-release.v${VERSION_CODE}.apk"
          fi

          DEBUG_APK=$(find app/build/outputs/apk/debug/ -name "*.apk" | head -n1)
          if [ -n "$DEBUG_APK" ]; then
            cp "$DEBUG_APK" "dist/better-coloros-debug.v${VERSION_CODE}.apk"
          fi

          echo "Generated APKs in dist/:"
          ls -la dist/

      - name: Upload APK Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: better-coloros-apks
          path: dist/*.apk
          retention-days: 30

      - name: Check Release Condition
        id: check_release
        run: |
          if [[ "${{ github.ref }}" == refs/tags/v* ]]; then
            echo "should_release=true" >> $GITHUB_OUTPUT
            echo "tag_name=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT
          elif [[ "${{ github.ref }}" == "refs/heads/master" || "${{ github.ref }}" == "refs/heads/main" || "${{ github.event.inputs.create_release }}" == "true" ]]; then
            echo "should_release=true" >> $GITHUB_OUTPUT
            VERSION_NAME=$(grep 'versionName =' app/build.gradle.kts | head -n1 | sed -E 's/.*"([^"]+)".*/\1/')
            echo "tag_name=v${VERSION_NAME}" >> $GITHUB_OUTPUT
          else
            echo "should_release=false" >> $GITHUB_OUTPUT
          fi

      - name: Publish GitHub Release
        if: steps.check_release.outputs.should_release == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.check_release.outputs.tag_name }}
          name: Release ${{ steps.check_release.outputs.tag_name }}
          files: dist/*.apk
          draft: false
          prerelease: false
          make_latest: true
          generate_release_notes: true
          body: |
            ## 🌟 Better ColorOS 体验增强工具箱发布

            专为 OPPO / 一加 (ColorOS) 打造的 LSPosed 系统级优化套件。

            ### ✨ 核心功能
            - **📷 相机文件名规范化**：自动将拍摄的照片与视频命名从缺少下划线的紧凑格式（`IMGYYYYMMDDHHmmss` / `VID...`）修正为 Android 行业标准带下划线格式（`IMG_YYYYMMDD_HHmmss` / `VID_...` / `MOD_...`），完整保留连拍与实况封面后缀。
            - **🖼️ 系统相册复制到剪贴板**：在系统相册右上角「更多」菜单中动态注入「复制到剪贴板」选项，使用原生 MediaStore URI 进行纯图片复制，方便跨端（KDE Connect / 微信 / QQ）一键 Ctrl+V / ⌘+V 粘贴。
            - **🎨 现代 Material You 界面**：全盘采用 Material Design 3 设计语言与 Monet 动态壁纸取色，完美适配直板手机、折叠屏及平板电脑（响应式双列豆腐块并排）。
            - **👁️ 桌面图标自由隐藏**：支持从设置中直接隐藏桌面图标，隐藏后依然支持随时从 LSPosed 管理器中重新打开。

            ### 📦 文件下载
            - **`better-coloros-release.v*.apk`**: 正式版安装包（已使用内置通用密钥签名，文件名附带数字版本号）
            - **`better-coloros-debug.v*.apk`**: 调试版安装包（文件名附带数字版本号）
